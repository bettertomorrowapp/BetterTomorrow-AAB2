name: Better Tomorrow AAB 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract clean Android project
        run: |
          unzip -q BetterTomorrow-AAB2-source.zip -d project
          test -f project/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore Play upload key
        env:
          KEYSTORE_B64: ${{ secrets.BT_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > upload-key.jks
          test -s upload-key.jks

      - name: Build signed AAB version 2
        working-directory: project
        env:
          BT_KEYSTORE_PATH: ${{ github.workspace }}/upload-key.jks
          BT_KEYSTORE_PASSWORD: ${{ secrets.BT_KEYSTORE_PASSWORD }}
          BT_KEY_ALIAS: ${{ secrets.BT_KEY_ALIAS }}
          BT_KEY_PASSWORD: ${{ secrets.BT_KEY_PASSWORD }}
        run: gradle --no-daemon clean bundleRelease

      - name: Verify bundle
        run: |
          ls -lh project/app/build/outputs/bundle/release/*.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterTomorrow-AAB2
          path: project/app/build/outputs/bundle/release/*.aab
          retention-days: 14
