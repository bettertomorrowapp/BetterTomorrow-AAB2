name: Prepare Better Tomorrow Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Better Tomorrow project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'BetterTomorrow_GITHUB*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: BetterTomorrow_GITHUB*.zip was not found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .

          # The old AAB workflows are not part of the new build plan.
          rm -f .github/workflows/build-aab2-FINAL.yml
          rm -f .github/workflows/build-aab2.yml

          # The ZIP is no longer needed after extraction.
          rm -f "$ZIP_FILE"

      - name: Show prepared project
        shell: bash
        run: |
          echo "=== Project root ==="
          ls -la
          echo "=== Android project files ==="
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f .github/workflows/build-release-aab.yml
          echo "All required project files are present."

      - name: Commit prepared project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Prepare Better Tomorrow Version 2 AAB project"
          git push
