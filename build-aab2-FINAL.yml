name: Better Tomorrow AAB 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify canonical source archive
        run: |
          test -f BetterTomorrow-AAB2-FINAL-SOURCE.zip
          unzip -t BetterTomorrow-AAB2-FINAL-SOURCE.zip >/dev/null
          unzip -q BetterTomorrow-AAB2-FINAL-SOURCE.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/java/com/bettertomorrow/app/MainActivity.java

      - name: Verify source version and package
        run: |
          grep -q "applicationId 'com.bettertomorrow.app'" project/app/build.gradle
          grep -q "versionCode 2" project/app/build.gradle
          grep -q "versionName '1.1'" project/app/build.gradle
          grep -q "private void showLive(String title)" project/app/src/main/java/com/bettertomorrow/app/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore Play upload key
        env:
          KEYSTORE_B64: ${{ secrets.BT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > upload-key.jks
          test -s upload-key.jks

      - name: Verify registered upload-key certificate
        env:
          STORE_PASSWORD: ${{ secrets.BT_KEYSTORE_PASSWORD }}
        run: |
          FP=$(keytool -list -v -keystore upload-key.jks -storepass "$STORE_PASSWORD" | awk -F': ' '/SHA256:/{print $2; exit}')
          test "$FP" = "49:D9:FA:17:26:92:84:43:AC:01:02:3E:F2:5F:60:C6:30:B6:64:C6:99:BD:25:0E:A3:B6:0A:C6:2A:92:EF:09"
          echo "Upload-key certificate matches the registered Play upload key."

      - name: Build signed release AAB
        working-directory: project
        env:
          BT_KEYSTORE_PATH: ${{ github.workspace }}/upload-key.jks
          BT_KEYSTORE_PASSWORD: ${{ secrets.BT_KEYSTORE_PASSWORD }}
          BT_KEY_ALIAS: ${{ secrets.BT_KEY_ALIAS }}
          BT_KEY_PASSWORD: ${{ secrets.BT_KEY_PASSWORD }}
        run: gradle --no-daemon clean bundleRelease

      - name: Verify signed AAB artifact
        run: |
          AAB=project/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "Signed AAB verified: $AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterTomorrow-AAB2
          path: project/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
