name: Better Tomorrow - Build Version 2 AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'BetterTomorrow_GITHUB*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: BetterTomorrow_GITHUB*.zip was not found."
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project

          # The ZIP contains the complete Android project.
          # Its GitHub workflow is not needed here because this workflow builds it directly.
          rm -rf project/.github

          echo "=== Project files ==="
          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/app/build.gradle
          echo "Project source is ready."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore Play upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.BT_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -e
          test -n "$KEYSTORE_B64"
          mkdir -p project/.signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > project/.signing/bettertomorrow-upload-key.jks
          test -s project/.signing/bettertomorrow-upload-key.jks

      - name: Build signed Version 2 AAB
        working-directory: project
        env:
          BT_UPLOAD_KEYSTORE_FILE: ${{ github.workspace }}/project/.signing/bettertomorrow-upload-key.jks
          BT_UPLOAD_KEY_ALIAS: ${{ secrets.BT_UPLOAD_KEY_ALIAS }}
          BT_UPLOAD_KEY_PASSWORD: ${{ secrets.BT_UPLOAD_KEY_PASSWORD }}
          BT_UPLOAD_STORE_PASSWORD: ${{ secrets.BT_UPLOAD_STORE_PASSWORD }}
        run: |
          set -e
          gradle :app:bundleRelease --stacktrace

      - name: Verify AAB exists and signature
        working-directory: project
        run: |
          set -e
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" > signature-check.txt
          grep -E "jar verified|X.509|CN=Better Tomorrow Upload" signature-check.txt || true
          echo "AAB created successfully:"
          ls -lh "$AAB"

      - name: Upload Version 2 AAB
        uses: actions/upload-artifact@v4
        with:
          name: BetterTomorrow-release-v2-AAB
          path: project/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signature report
        uses: actions/upload-artifact@v4
        with:
          name: BetterTomorrow-signature-report
          path: project/signature-check.txt
          if-no-files-found: error
